name: Delivery integrity

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  delivery-integrity:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/spec-lint/package-lock.json
      - run: npm ci --prefix tools/spec-lint
      - run: node --import ./tools/spec-lint/node_modules/tsx/dist/loader.mjs --test tools/delivery/*.test.ts
      - run: tools/spec-lint/node_modules/.bin/tsc --project tools/delivery/tsconfig.json
      - name: Capture live release truth
        shell: bash
        run: |
          set +e
          tools/spec-lint/node_modules/.bin/tsx tools/release/stamp_gate.ts --json > /tmp/stamp.json
          stamp_status=$?
          tools/spec-lint/node_modules/.bin/tsx tools/release/exact_status_scan.ts --json > /tmp/exact.json
          exact_status=$?
          set -e
          if (( stamp_status > 1 )); then exit "$stamp_status"; fi
          exit "$exact_status"
      - run: tools/spec-lint/node_modules/.bin/tsx tools/delivery/verify.ts --stamp /tmp/stamp.json --exact /tmp/exact.json --feature-dependencies delivery/feature-dependencies.json --policy delivery/release-policy.json --release-plan delivery/release-plan.json --roadmap delivery/roadmap-contract.json --linear-project-scope delivery/linear-project-scope.json
      - run: npm --prefix tools/spec-lint run typecheck
      - run: npm --prefix tools/spec-lint run all
      - run: tools/spec-lint/node_modules/.bin/tsx tools/repo-hygiene/no_legacy_drift.ts
      - run: tools/spec-lint/node_modules/.bin/tsx tools/release/appendix_j_lineage.ts

  linear-capture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/spec-lint/package-lock.json
      - run: npm ci --prefix tools/spec-lint
      - name: Capture complete Linear fingerprint
        run: tools/spec-lint/node_modules/.bin/tsx tools/delivery/linear-live.ts --linear-project-scope delivery/linear-project-scope.json --out /tmp/linear-fingerprint.json --receipt-out /tmp/linear-capture-receipt.json
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: linear-fingerprint-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/linear-fingerprint.json
            /tmp/linear-capture-receipt.json
          if-no-files-found: error
          retention-days: 7

  linear-drift:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/spec-lint
      - run: tools/spec-lint/node_modules/.bin/tsx tools/delivery/linear-live.ts --snapshot delivery/linear-snapshot.json --linear-project-scope delivery/linear-project-scope.json --out /tmp/linear-fingerprint.json --receipt-out /tmp/linear-capture-receipt.json
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linear-drift-fingerprint-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/linear-fingerprint.json
            /tmp/linear-capture-receipt.json
          if-no-files-found: error
          retention-days: 7
