name: Vercel production baseline

on:
  workflow_dispatch:
    inputs:
      baseline_reason:
        description: Reviewed reason for creating the first forward-only production baseline
        required: true
        type: string
      forward_only_acknowledged:
        description: Confirm partial activation cannot be rolled back and requires same-receipt recovery
        required: true
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: sourcera-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Require a main-branch dispatch
        env:
          SOURCERA_RELEASE_DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCERA_RELEASE_DISPATCH_REF" = "refs/heads/main"
      - name: Confirm forward-only baseline acknowledgement
        env:
          SOURCERA_BASELINE_FORWARD_ONLY_ACK: ${{ inputs.forward_only_acknowledged }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCERA_BASELINE_FORWARD_ONLY_ACK" = "true"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - run: npm --prefix tools/spec-lint ci --ignore-scripts
      - name: Run the no-secret production preflight
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
        run: >-
          npm run release:production:preflight --
          --out-dir "$RUNNER_TEMP/vercel-baseline-preflight"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: vercel-production-baseline-preflight-${{ github.sha }}-${{ github.run_id }}
          overwrite: false
          path: ${{ runner.temp }}/vercel-baseline-preflight
          retention-days: 90

  approval:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sourcera-production-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-preflight-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-preflight
      - name: Create the protected baseline approval handoff
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_BASELINE_FORWARD_ONLY_ACK: ${{ inputs.forward_only_acknowledged }}
          SOURCERA_BASELINE_REASON: ${{ inputs.baseline_reason }}
          SOURCERA_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
          SOURCERA_RELEASE_GITHUB_TOKEN: ${{ secrets.SOURCERA_RELEASE_GITHUB_TOKEN }}
        run: >-
          npm run release:vercel-baseline:github --
          --preflight-dir "$RUNNER_TEMP/vercel-baseline-preflight"
          --out-dir "$RUNNER_TEMP/vercel-baseline-approval"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: vercel-production-baseline-approval-${{ github.sha }}-${{ github.run_id }}
          overwrite: false
          path: ${{ runner.temp }}/vercel-baseline-approval
          retention-days: 90

  stage:
    needs:
      - approval
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sourcera-production-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt-sha256: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-preflight-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-approval-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-approval
      - name: Stage and prove all three baseline candidates without traffic
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_APPROVAL_ARTIFACT_DIGEST: ${{ needs.approval.outputs.artifact-digest }}
          SOURCERA_BASELINE_FORWARD_ONLY_ACK: ${{ inputs.forward_only_acknowledged }}
          SOURCERA_BASELINE_REASON: ${{ inputs.baseline_reason }}
          SOURCERA_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run vercel:baseline:stage --
          --preflight-dir "$RUNNER_TEMP/vercel-baseline-preflight"
          --github-proof "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-github-proof.json"
          --github-approval "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-protected-reviewer-proof.json"
          --github-handoff "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-github-handoff.json"
          --receipt-out "$RUNNER_TEMP/vercel-production-baseline-stage.json"
      - id: receipt
        name: Hash the exact stage receipt bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum "$RUNNER_TEMP/vercel-production-baseline-stage.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: vercel-production-baseline-stage-${{ github.sha }}-${{ github.run_id }}
          overwrite: false
          path: ${{ runner.temp }}/vercel-production-baseline-stage.json
          retention-days: 90

  activate:
    needs:
      - approval
      - preflight
      - stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sourcera-production-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-preflight-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-approval-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-approval
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-production-baseline-stage-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-baseline-stage
      - name: Activate or safely resume the exact baseline receipt
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_APPROVAL_ARTIFACT_DIGEST: ${{ needs.approval.outputs.artifact-digest }}
          SOURCERA_BASELINE_FORWARD_ONLY_ACK: ${{ inputs.forward_only_acknowledged }}
          SOURCERA_BASELINE_REASON: ${{ inputs.baseline_reason }}
          SOURCERA_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
          SOURCERA_STAGE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.artifact-digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run vercel:baseline:activate --
          --preflight-dir "$RUNNER_TEMP/vercel-baseline-preflight"
          --github-proof "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-github-proof.json"
          --github-approval "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-protected-reviewer-proof.json"
          --github-handoff "$RUNNER_TEMP/vercel-baseline-approval/vercel-baseline-github-handoff.json"
          --stage-receipt "$RUNNER_TEMP/vercel-baseline-stage/vercel-production-baseline-stage.json"
          --stage-receipt-sha256 "${{ needs.stage.outputs.receipt-sha256 }}"
          --receipt-out "$RUNNER_TEMP/vercel-production-baseline-activation.json"
      - id: receipt_check
        name: Validate the required activation receipt before publication
        if: always()
        env:
          RECEIPT_PATH: ${{ runner.temp }}/vercel-production-baseline-activation.json
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.env.RECEIPT_PATH,"utf8"));if(!["failed","passed","recovery_required"].includes(r.result)||r.rollbackClaimed!==false)throw new Error("invalid activation receipt")'
      - if: always() && steps.receipt_check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: vercel-production-baseline-activation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: |
            ${{ runner.temp }}/vercel-production-baseline-activation.json
            ${{ runner.temp }}/vercel-baseline-stage/vercel-production-baseline-stage.json
            ${{ runner.temp }}/vercel-baseline-preflight
            ${{ runner.temp }}/vercel-baseline-approval
          retention-days: 90
