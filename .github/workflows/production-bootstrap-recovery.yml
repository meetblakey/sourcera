name: Convex anchor bootstrap recovery

on:
  workflow_dispatch:
    inputs:
      known_good_sha:
        description: Exact live Convex SHA to prove without mutation
        required: true
        type: string
      baseline_sha:
        description: Exact main SHA activated by the Vercel production baseline workflow
        required: true
        type: string
      baseline_run_id:
        description: Exact successful Vercel production baseline workflow run ID
        required: true
        type: number
      baseline_activation_attempt:
        description: Exact successful Vercel production baseline workflow attempt
        required: true
        type: number
      baseline_activation_artifact_name:
        description: Exact nonexpired Vercel baseline activation artifact name
        required: true
        type: string
      baseline_activation_artifact_digest:
        description: Exact sha256 digest reported for the activation artifact
        required: true
        type: string
      baseline_stage_receipt_sha256:
        description: Exact SHA-256 of the downloaded baseline stage receipt bytes
        required: true
        type: string
      bootstrap_reason:
        description: Reviewed narrative context; never authorizes the route
        required: true
        type: string
      bootstrap_route:
        description: Machine-proved recovery route
        required: true
        type: choice
        options:
          - initial_genesis
          - expired_anchor
      expired_anchor_identity_json:
        description: Exact selected expired anchor JSON; blank for initial_genesis
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: sourcera-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Require a main-branch dispatch
        env:
          SOURCERA_RELEASE_DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCERA_RELEASE_DISPATCH_REF" = "refs/heads/main"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - run: npm --prefix tools/spec-lint ci --ignore-scripts
      - name: Run the no-secret release preflight
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
        run: >-
          npm run release:production:preflight --
          --out-dir "$RUNNER_TEMP/production-preflight"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: production-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: ${{ runner.temp }}/production-preflight
          retention-days: 90

  approval:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sourcera-production-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-preflight
      - name: Download the exact successful Vercel baseline activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.baseline_activation_artifact_name }}
          path: ${{ runner.temp }}/vercel-baseline
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
      - name: Create the protected Convex anchor approval proof
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_BOOTSTRAP_REASON: ${{ inputs.bootstrap_reason }}
          SOURCERA_BOOTSTRAP_ROUTE: ${{ inputs.bootstrap_route }}
          SOURCERA_EXPIRED_ANCHOR_IDENTITY_JSON: ${{ inputs.expired_anchor_identity_json }}
          SOURCERA_KNOWN_GOOD_SHA: ${{ inputs.known_good_sha }}
          SOURCERA_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
          SOURCERA_RELEASE_GITHUB_TOKEN: ${{ secrets.SOURCERA_RELEASE_GITHUB_TOKEN }}
          SOURCERA_VERCEL_BASELINE_ARTIFACT_DIGEST: ${{ inputs.baseline_activation_artifact_digest }}
          SOURCERA_VERCEL_BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_activation_artifact_name }}
          SOURCERA_VERCEL_BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_activation_attempt }}
          SOURCERA_VERCEL_BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          SOURCERA_VERCEL_BASELINE_SHA: ${{ inputs.baseline_sha }}
          SOURCERA_VERCEL_BASELINE_STAGE_RECEIPT_SHA256: ${{ inputs.baseline_stage_receipt_sha256 }}
        run: >-
          npm run release:production:github --
          --anchor-mode genesis
          --preflight-dir "$RUNNER_TEMP/production-preflight"
          --vercel-baseline-dir "$RUNNER_TEMP/vercel-baseline"
          --out-dir "$RUNNER_TEMP/production-approval"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: production-approval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: ${{ runner.temp }}/production-approval
          retention-days: 90

  convex-anchor:
    needs:
      - approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sourcera-production-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-approval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-approval
      - name: Prove the live Convex anchor without provider mutation
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_CONVEX_CANARY_SECRET: ${{ secrets.SOURCERA_CONVEX_CANARY_SECRET }}
          SOURCERA_ENV: production
          SOURCERA_KNOWN_GOOD_SHA: ${{ inputs.known_good_sha }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
        run: >-
          npm run convex:bootstrap:production --
          --approval-receipt "$RUNNER_TEMP/production-approval/github-production-approval.json"
          --receipt-out "$RUNNER_TEMP/convex-genesis-anchor.json"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: production-anchor-authority-${{ inputs.known_good_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: ${{ runner.temp }}/convex-genesis-anchor.json
          retention-days: 90

  blocked:
    needs:
      - convex-anchor
      - approval
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sourcera-production-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24.16.0'
      - name: Verify pinned Node and npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-approval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-approval
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-anchor-authority-${{ inputs.known_good_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convex-anchor
      - name: Emit the immutable non-promotable DEC-PROD-002 receipt
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SOURCERA_APPROVAL_ARTIFACT_DIGEST: ${{ needs.approval.outputs.artifact-digest }}
          SOURCERA_KNOWN_GOOD_SHA: ${{ inputs.known_good_sha }}
          SOURCERA_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest }}
          SOURCERA_RELEASE_APPROVED_SHA: ${{ github.sha }}
        run: >-
          npm run release:production:blocked --
          --anchor-mode genesis
          --preflight-dir "$RUNNER_TEMP/production-preflight"
          --github-proof "$RUNNER_TEMP/production-approval/github-production-proof.json"
          --github-handoff "$RUNNER_TEMP/production-approval/github-handoff.json"
          --convex-anchor-receipt "$RUNNER_TEMP/convex-anchor/convex-genesis-anchor.json"
          --receipt-out "$RUNNER_TEMP/production-release-blocked-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: production-release-blocked-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: ${{ runner.temp }}/production-release-blocked-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 90
      - name: Fail closed until DEC-PROD-002 is resolved
        shell: bash
        run: exit 1
