name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCERA_COMMIT_SHA: ${{ github.sha }}
      SOURCERA_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Validate Marketplace deployment
        run: npm run validate:deploy
        env:
          SOURCERA_DOMAIN: marketplace
      - name: Validate Buyer deployment
        run: npm run validate:deploy --workspace @sourcera/buyer
        env:
          SOURCERA_DOMAIN: buyer
      - name: Validate Seller deployment
        run: npm run validate:deploy --workspace @sourcera/seller
        env:
          SOURCERA_DOMAIN: seller
      - run: npm run verify
